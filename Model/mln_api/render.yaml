services:
  - type: web
    name: ikigori-mln-api
    runtime: python
    rootDir: Model/mln_api
    region: frankfurt
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: MODEL_URL
        value: "https://huggingface.co/Kabisa/ikigori-mln-model/resolve/main/baseline_final.pt"
      - key: ALLOWED_ORIGINS
        value: "*"
