services:
  - type: web
    name: ikigori-gatekeeper-api
    runtime: python
    rootDir: Model/gatekeeper_api
    region: frankfurt
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: MODEL_URL
        value: "https://huggingface.co/Kabisa/ikigori-gatekeeper/resolve/main/gatekeeper_model2.pth"
      - key: ALLOWED_ORIGINS
        value: "*"
